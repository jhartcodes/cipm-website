# Netlify configuration for Astro + Sanity deployment
[build]
  publish = "dist"
  command = "npm run build"

  # Ignore README and docs in secrets scanning (false positives)
  environment = { SECRETS_SCAN_OMIT_PATHS = "README.md,documentation/**" }

# Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
