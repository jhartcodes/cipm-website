# Netlify configuration for Astro + Sanity deployment
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Exclude intentionally public Sanity vars from secrets scanning
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SANITY_DATASET,PUBLIC_SANITY_PROJECT_ID"

# Note: Redirects are handled by @astrojs/netlify adapter automatically
# Do NOT add a catch-all redirect to index.html - this is SSR, not SPA
